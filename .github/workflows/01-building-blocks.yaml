
name: 01-Building-Blocks

on:
  workflow_dispatch:

jobs:
  echo-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello World"

  
  echo-goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: Failed Step
        id: failed_step
        continue-on-error: true
        run: |
          echo "I will fail"
          exit 1

      - name: Handle Failure
        if: ${{ steps.failed_step.outcome == 'failure' }}
        run: echo "Previous step failed. Handling failure."

      - name: Handle Success
        if: ${{ steps.failed_step.outcome == 'success' }}
        run: echo "Previous step succeeded."

      - name: Say Goodbye
        run: echo "Goodbye World"