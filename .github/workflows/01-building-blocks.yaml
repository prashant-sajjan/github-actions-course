
name: 01-Building-Blocks

on:
  push:

jobs:
  echo-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello World"

  
  echo-goodbye:
    runs-on: ubuntu-latest
    steps:
      - name: Failed Step
        id: failed_step
        continue-on-error: true
        run: |
          echo "I will fail"
          exit 1

      - name: Check Step Status
        run: |
          echo "Outcome: ${{ steps.failed_step.outcome }}"
          echo "Conclusion: ${{ steps.failed_step.conclusion }}"

      - name: Say Goodbye
        run: echo "Goodbye World"